	</style></head><body dir="ltr"><h1 class="P5"><a name="My_LinuxBIOS_Project" />My LinuxBIOS Project</h1><p class="P1">July 2007 </p><h2 class="P7"><a name="Motivation" />Motivation</h2><p class="P2">I wanted to learn how to build and install <a href="http://www.linuxbios.org/">LinuxBIOS</a> on a PC. I also wanted to use the virtualization hardware of my CPU – I read reports that many proprietary BIOSs have disabled hardware support for virtual machines.</p><h3 class="P6"><a name="Preamble" />Preamble</h3><p class="P3">I purchased a new PC with a motherboard that supports LinuxBIOS. Here's what I got: </p><ol style="margin-left:1.25cm;list-style-type:decimal; "><li class="P10" style="margin-left:0cm;"><p class="P10" style="margin-left:0.25cm;">Gigabyte M57SLI-S4 rev 1.1 – came with Award BIOS version F8 </p></li><li class="P10" style="margin-left:0cm;"><p class="P10" style="margin-left:0.25cm;">BFG Gforce2 8600GTS video card </p></li><li class="P10" style="margin-left:0cm;"><p class="P10" style="margin-left:0.25cm;">AMD Athlon 64 X2 – 6000+ </p></li><li class="P10" style="margin-left:0cm;"><p class="P10" style="margin-left:0.25cm;">4GB RAM - OCZ PC2-6400 </p></li><li class="P10" style="margin-left:0cm;"><p class="P10" style="margin-left:0.25cm;">Seagate 320GB SATA HD </p></li></ol><h3 class="P6"><a name="Inamble" />Inamble</h3><ol style="margin-left:1.25cm;list-style-type:decimal; "><li class="P15" style="margin-left:0cm;"><p class="P15" style="margin-left:0.25cm;">Installed Fedora 7 (X86_64 version) and found virtualization disabled by Award BIOS version F8. </p></li><li class="P15" style="margin-left:0cm;"><p class="P15" style="margin-left:0.25cm;">I installed BIOS version F9 to see if virtualization instructions in the CPU were enabled – they were not.  </p></li><li class="P28" style="margin-left:0cm;"><p class="P28" style="margin-left:0.25cm;"><span class="T1">Ordered replacement BIOS chip (</span>SST 49LF040) <span class="T1">and extractor tool from </span><a href="http:..www,ultrabios.com"><span class="T1">ultrabios.</span></a></p></li><li class="P28" style="margin-left:0cm;"><p class="P28" style="margin-left:0.25cm;"><span class="T1">Here is a </span><a href="http://chip-tool.jpg/"><span class="T1">photo</span></a><span class="T1">.</span></p></li><li class="P15" style="margin-left:0cm;"><p class="P15" style="margin-left:0.25cm;">The chip (4 MBits or 512MBytes) fits a PLCC-32 (32 pin) socket. I bought the extractor tool as a precaution. </p></li><li class="P28" style="margin-left:0cm;"><p class="P28" style="margin-left:0.25cm;"><span class="T1">I found a guy, Frank, who is from China and now lives in Markham (just north of Toronto). Frank has lots of experience of soldering components onto motherboards. You can reach Frank at </span><a href="http://biosxp.net/"><span class="T1">biosxp.net</span></a><span class="T1">. </span></p></li><li class="P28" style="margin-left:0cm;"><p class="P28" style="margin-left:0.25cm;"><span class="T1">Frank did this </span><a href="http://private.vlsi.informatik.tu-darmstadt.de/st/instructions.html"><span class="T1">modification</span></a><span class="T1"> for me. He did a wonderful job and only charged $50 for his labour and parts. Here's a </span><a href="http://mb-with-plcc.jpg/"><span class="T1">photo</span></a><span class="T1"> of his work.</span></p></li><li class="P28" style="margin-left:0cm;"><p class="P28" style="margin-left:0.25cm;"><span class="T1">I then put my PC back together and inserted the new BIOS chip into the socket. Here's a </span><a href="http://mb-with-plcc-rom.jpg/"><span class="T1">photo</span></a><span class="T1">.</span></p></li><li class="P15" style="margin-left:0cm;"><p class="P15" style="margin-left:0.25cm;">So now I had a PC with two BIOS chips (both with Award BIOS F9) and with a flick of a switch I could boot from either BIOS. </p></li><li class="P15" style="margin-left:0cm;"><p class="P15" style="margin-left:0.25cm;">I got a NABU (circa 1983) dumb terminal from a friend at work and connected it to my PC's serial port.  You'll need this because LinuxBIOS sends log messages to the serial port. Without it you won't see any boot-up messages. </p></li><li class="P15" style="margin-left:0cm;"><p class="P15" style="margin-left:0.25cm;">I enabled the telnet server on my PC and connected to it with the NABU terminal. I had to set the baud rate to 19200 in /etc/inittab because this was the maximum the NABU could handle. </p></li></ol><p class="P3">        <span class="T2">s0:2345:respawn:/sbin/agetty -L -h ttyS0 1 19200 vt100-nav</span></p><ol style="margin-left:1.25cm;list-style-type:decimal; "><li class="P21" style="margin-left:0cm;"><p class="P21" style="margin-left:0.25cm;">I found out later that this was a dumb idea because the boot-up messages streamed to the serial port by LinuxBIOS were going much faster then 19200 and I just got garbage on the screen. Later I dumped the NABU and set up a second PC with minicom. I set the serial port speed to 115200 baud. Now I could see the boot-up messages. NOTE: The minicom PC should be connected to the LinuxBIOS PC with a serial null modem cable. I bouht one at a surplus computer store for $4. </p></li><li class="P21" style="margin-left:0cm;"><p class="P21" style="margin-left:0.25cm;">Now I had to start dealing with software so I tried to follow the<a href="http://linuxbios.org/GIGABYTE_GA-M57SLI-S4_Build_Tutorial"> build tutorial</a> for my board.</p></li><li class="P21" style="margin-left:0cm;"><p class="P21" style="margin-left:0.25cm;">The first thing I did was download, build and install flashrom, which I will need to program my bios chip. Here are the steps: </p></li></ol><p class="Textbody"><span class="T1">        </span><span class="T2">svn co svn://linuxbios.org/repos/trunk/util/flashrom</span></p><p class="P4">        make</p><p class="P4">        make install (do this as root and it will put the flashrom program into /usr/local/bin)</p><ol style="margin-left:1.25cm;list-style-type:decimal; "><li class="P24" style="margin-left:0cm;"><p class="P24" style="margin-left:0.25cm;">Now I made a backup image of my BIOS like this: </p></li></ol><p class="P3">        <span class="T2">flashrom -r award-bios.f9</span></p><ol style="margin-left:1.25cm;list-style-type:decimal; "><li class="P25" style="margin-left:0cm;"><p class="P25" style="margin-left:0.25cm;">Of course, you should be root when running flashrom so be careful. </p></li><li class="P25" style="margin-left:0cm;"><p class="P25" style="margin-left:0.25cm;">For more help with flashrom you can use the -h option to view the syntax and options. </p></li><li class="P25" style="margin-left:0cm;"><p class="P25" style="margin-left:0.25cm;">Now I had to download, configure and build F<a href="http://linuxbios.org/FILO">ILO</a>, which would be my payload.</p><p class="P8" style="margin-left:0.25cm;">svn co svn://openbios.org/filo/trunk/filo-0.5 </p><p class="P8" style="margin-left:0.25cm;"> </p></li><li class="P33" style="margin-left:0cm;"><p class="P33" style="margin-left:0.25cm;"><span class="T1">Change to the filo-0.5 directory and run the make command. This will create a Config file which you need to modify. Here's my </span><a href="http://Config/"><span class="T1">Config</span></a><span class="T1"> file.</span></p></li><li class="P33" style="margin-left:0cm;"><p class="P33" style="margin-left:0.25cm;"><span class="T1">Notice that the Config file will be using GRUB emulation mode to load the Linux kernel. For this reason the Config file must include the full path name of your menu.lst file, which is the default name of GRUB's menu file. Also notice that the device name I use is hde3, which FILO recognizes as sda3.</span></p></li><li class="P33" style="margin-left:0cm;"><p class="P33" style="margin-left:0.25cm;"><span class="T1">My menu.lst file is named </span><a href="http://lbmenu.lst/"><span class="T1">lbmenu.lst</span></a><span class="T1">. You can see how it resembles a regular GRUB menu file. But make note of the root device, (hda4,2), which is equivalent to sda3.</span></p></li><li class="P33" style="margin-left:0cm;"><p class="P33" style="margin-left:0.25cm;"><span class="T1">You'll also notice the lbmenu.lst file contains the tty port (ttyS0 or COM1) and the baud rate (115200) that LinuxBIOS will use to stream boot-up (log) messages.</span></p></li><li class="P33" style="margin-left:0cm;"><p class="P33" style="margin-left:0.25cm;"><span class="T1">Now run make again and this will produce filo.elf, the payload, which we'll need later when we build LinuxBIOS.</span></p></li><li class="P33" style="margin-left:0cm;"><p class="P33" style="margin-left:0.25cm;"><span class="T1">At last we now need to download, configure and build the LinuxBIOS. The product of this effort will be a BIOS image (linuxbios.rom) which we'll flash to our second BIOS chip using the flashrom program. </span></p></li></ol><p class="Textbody"><span class="T1">        </span><span class="T2">svn co svn://linuxbios.org/repos/trunk/LinuxBIOSv2</span></p><ol style="margin-left:1.25cm;list-style-type:decimal; "><li class="P33" style="margin-left:0cm;"><p class="P33" style="margin-left:0.25cm;"><span class="T1">We'll be using version 2, the stable version. Version 3 is still under development. </span></p></li><li class="P33" style="margin-left:0cm;"><p class="P33" style="margin-left:0.25cm;"><span class="T1">Change to directory LinuxBIOSv2/targets/gigabyte and create a directory named payloads. Copy the filo.elf payload file that you created earlier to this payloads directory.</span></p></li><li class="P33" style="margin-left:0cm;"><p class="P33" style="margin-left:0.25cm;"><span class="T1">Change to directory LinuxBIOSv2/targets and run the command</span></p></li></ol><p class="Textbody"><span class="T1">        </span><span class="T2">./buildtarget gigabyte/m57sli</span></p><ol style="margin-left:1.25cm;list-style-type:decimal; "><li class="P33" style="margin-left:0cm;"><p class="P33" style="margin-left:0.25cm;"><span class="T1">Edit the file targets/gigabyte/m57sli/Config.lb updating all the lines that start with 'payload'. There are 2 occurrences, one for the normal image, and one for the fallback image.</span></p></li><li class="P33" style="margin-left:0cm;"><p class="P33" style="margin-left:0.25cm;"><span class="T1">Finally we can build the BIOS image by changing to directory LinuxBIOSv2/targets/gigabyte/m57sli/m57sli and running the make command. Yes, there are two directories named m57sli – it's not a typo.</span></p></li><li class="P33" style="margin-left:0cm;"><p class="P33" style="margin-left:0.25cm;"><span class="T1">If all goes well you should see a file named linuxbios.rom (512K) in the directory.</span></p></li><li class="P33" style="margin-left:0cm;"><p class="P33" style="margin-left:0.25cm;"><span class="T1">Now you can switch to your new BIOS chip. In my setup I installed a toggle switch on the back of my PC. I also labeled the switch (ORIG and NEW) so I'd always know which is which.</span></p></li><li class="P33" style="margin-left:0cm;"><p class="P33" style="margin-left:0.25cm;"><span class="T1">Use flashrom to flash your new BIOS chip. You'll need to be root to do this. </span></p></li></ol><p class="Textbody"><span class="T1">        </span><span class="T2">flashrom -v -w linuxbios.rom</span></p><ol style="margin-left:1.25cm;list-style-type:decimal; "><li class="P33" style="margin-left:0cm;"><p class="P33" style="margin-left:0.25cm;"><span class="T1">So now you should have the Award BIOS sitting in the original chip and the LinuxBIOS in the new chip.</span></p></li><li class="P33" style="margin-left:0cm;"><p class="P33" style="margin-left:0.25cm;"><span class="T1">Go to your monitor PC and start minicom. You'll need to set the modem initialization string to ~^M~. You can also use CTRL-A L to turn on the capture file.</span></p></li><li class="P33" style="margin-left:0cm;"><p class="P33" style="margin-left:0.25cm;"><span class="T1">Now power off your linuxBIOS PC, as a reset may not work. Now power it on and watch the messages on your logging PC. After some time you should get a graphical login prompt on your LinuxBIOS PC. </span></p></li><li class="P33" style="margin-left:0cm;"><p class="P33" style="margin-left:0.25cm;"><span class="T1">Have a lot of fun.</span></p></li></ol></body></html>
